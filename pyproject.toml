[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yeaboi"
version = "4.1.0"
description = "yeaboi — an AI Scrum Master for your terminal: sprint planning, standups, retros, planning poker, 1:1s and delivery reports, plus cost and security posture for your AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Omar Din"}]
license = {text = "MIT"}
# Dropped "yeaboi" (the brand name collides with a musician, a food truck and a
# racehorse — unwinnable and it wastes a slot) and "team-lead" (careers intent).
# These target what someone shopping for this tool actually searches for.
keywords = [
    "ai-scrum-master", "scrum", "agile", "sprint-planning", "standup",
    "retrospective", "planning-poker", "jira", "azure-devops",
    "project-management", "cli", "tui", "ai-agent", "mcp", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # The built front-end bundles every board, share and export is drawn with.
    # A hard dependency, not an extra: without it `yeaboi retro`, every exporter
    # and every shared page render nothing. Major-pinned because the entry names
    # (`retro.js`, `export.css`, …) are the contract between the two repos, and
    # `web/assets.py` reads them by name.
    "yeaboi-web-assets>=1,<2",
    "langchain",
    "langgraph",
    # LLM provider integrations — langchain-anthropic is the default.
    # langchain-openai and langchain-google-genai are optional; they are
    # lazy-imported in llm.py and only needed when LLM_PROVIDER is set to
    # "openai" or "google". Install all with: uv sync --extra all-providers
    # The OpenAI-wire vendors (xAI, DeepSeek, Moonshot, Mistral, Qwen, Z.ai —
    # see llm_providers.py) need no extra of their own: they are ChatOpenAI
    # pointed at another host, so the `openai` extra already covers them.
    "langchain-anthropic",
    "rich",
    "prompt-toolkit",
    "python-dotenv",
    "PyGithub",
    "azure-devops",
    "jira",
    "atlassian-python-api",
    # Notion doc tools (tools/notion.py) — official SDK, mirrors how Confluence
    # uses atlassian-python-api. Notion has its own integration token (NOTION_TOKEN).
    "notion-client",
    # SQLite-backed checkpoint store for Phase 8 session persistence.
    # SqliteSaver is used as a standalone store; the graph itself stays
    # stateless for now (Phase 8B wires it as a full LangGraph checkpointer).
    "langgraph-checkpoint-sqlite",
    # Bank/public holiday detection by country — used by detect_bank_holidays tool
    # to auto-populate capacity deductions during intake.
    "holidays",
    # Pure-python QR generator (no deps) — used to render the Retro "invite" QR
    # (retro/server.py:/api/qr) so teammates can scan to join. Offline, no CDN.
    "segno",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
pdf = ["pymupdf"]
# Word/PowerPoint roadmap ingestion — lazy-imported in roadmap/ingest.py so the
# Roadmap intake card can read .docx/.pptx quarterly roadmaps, and Reporting
# writes a native PowerPoint (.pptx) deck. Optional because most users point at
# Confluence/Notion/markdown and the HTML slide deck instead.
docs = ["python-docx", "python-pptx"]
bedrock = ["langchain-aws", "boto3"]
# Read-only cloud connectors (AWS CloudWatch alarms, Google Cloud error groups).
# Lazy-imported inside each probe, and the descriptors are pure stdlib data, so
# the catalog lists cloud providers on a plain install and only verifying or
# gathering asks for this. Azure is deliberately absent: its whole path is plain
# REST through connectors/http.py, which is what keeps it inside the SSRF guard.
cloud = ["boto3", "google-auth"]
# Local LLM via an Ollama server — free, private, no API key. See README:
# "Local Mode (Ollama)".
ollama = ["langchain-ollama"]
# Voice input — record mic audio (sounddevice) and transcribe locally and
# offline with faster-whisper. Lazy-imported in voice.py; needs no API key
# (works with any LLM provider). The sounddevice wheels bundle PortAudio on
# macOS/Windows (self-contained); Linux also needs the system lib
# (`apt install libportaudio2`). A Whisper model downloads once on first use.
voice = ["sounddevice", "faster-whisper"]
# Chart images embedded in exports (velocity / delivered-work PNGs). Lazy-
# imported in charts.py — without the extra, exports simply skip the charts.
charts = ["matplotlib>=3.8"]
# MCP server — expose yeaboi's modes as tools to AI coding agents
# (Claude Code, Cursor, Codex CLI, VS Code, …). Official python-sdk, v1 line;
# v2 is a pre-release with breaking API changes, so the <2 pin is load-bearing.
mcp = ["mcp>=1.9,<3"]
# Cloudflare Access tier (YEABOI_SHARE_MODE=access) — verify the Access JWT on
# every tunnel-borne request locally, against Cloudflare's published signing
# keys, instead of trusting the edge's header. Lazy-imported in
# sharing/identity.py: without the extra the tier refuses to start and says so,
# and the quick tunnel (the default) is unaffected. [crypto] pulls in
# `cryptography`, which is what does the RS256 verification.
access = ["PyJWT[crypto]>=2.8"]
all-providers = ["langchain-openai", "langchain-google-genai", "langchain-aws", "boto3", "langchain-ollama"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-recording",
    # `-n auto --dist loadfile` on the unit lane. The suite was fully serial and
    # the two test jobs were the whole pipeline; this is the cheapest minute to
    # get back. loadfile keeps a file's tests on one worker — see the Makefile.
    "pytest-xdist",
    "ruff",
    "pre-commit",
    # so CI exercises the chart-generation tests
    "matplotlib>=3.8",
    # so CI exercises the MCP server tests
    "mcp>=1.9,<3",
    # so the voice tests exercise the real resampling maths — the hand-rolled
    # numpy fake in tests/unit/test_voice.py cannot stand in for np.interp.
    # numpy arrives transitively with faster-whisper at runtime; naming it here
    # keeps the resample tests runnable without the (heavy) voice extra.
    "numpy>=1.24,<3",
    # tomllib is stdlib from 3.11; four guard tests read pyproject.toml and the
    # packaging manifests, and they have to run on the floor too.
    "tomli; python_version < '3.11'",
    # tests/unit/test_workflow_concurrency.py and tests/contract/ parse YAML.
    # It arrives transitively via langchain anyway; naming it here keeps a
    # dependency reshuffle from breaking unit-test *collection*.
    "pyyaml",
]

[project.urls]
# The org, not a personal path — the old ones still work via GitHub's 301, but a
# redirect splits link equity and PyPI's sidebar links are real backlinks from a
# high-authority domain. Repository travels to the site in contracts/site.json,
# where it becomes the JSON-LD codeRepository.
Homepage = "https://yeaboi.ai"
Documentation = "https://yeaboi.ai/docs/index.html"
Repository = "https://github.com/yeaboi-ai/yeaboi.ai"
Issues = "https://github.com/yeaboi-ai/yeaboi.ai/issues"

[project.scripts]
yeaboi = "yeaboi.cli:main"
# Back-compat alias (one release) — existing installs / the standup scheduler
# may still reference the old command name.
scrum-agent = "yeaboi.cli:main"
# MCP stdio server (requires the [mcp] extra):
#   uvx --from 'yeaboi[mcp]' yeaboi-mcp
yeaboi-mcp = "yeaboi.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yeaboi"]

# The desktop route surface, so Niko's `navigate` tool can refuse a route the
# window does not serve. Only `src/yeaboi` ships, and reading contracts/ from a
# wheel would find nothing — the resolver in niko/tools.py prefers this copy and
# falls back to contracts/ in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"contracts/v1/routes_manifest.json" = "yeaboi/data/routes_manifest.json"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".tooling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that compile the graph or run multi-node flows (skip with: -m 'not slow')",
    "eval: golden dataset evaluators (run with: make eval)",
    "vcr: contract tests using recorded API responses (run with: make record to re-record)",
    "smoke: live API smoke tests requiring real credentials (run with: make smoke-test)",
]

[tool.ruff]
src = ["src"]
line-length = 120
# Explicit rather than inferred from requires-python: pyupgrade (UP) rewrites are
# gated on it, so the version the linter targets is a decision, not a side effect.
target-version = "py310"

[tool.ruff.lint]
# "S" = flake8-bandit security rules (SAST). See `make security`.
select = ["E", "F", "I", "N", "W", "UP", "S"]
# High-noise bandit rules that don't map to real vulnerabilities in this codebase
# (audited): every subprocess call uses list-form argv (never shell=True), CLI
# tools are intentionally resolved via PATH, and the try/except-pass sites are
# best-effort cleanup. Suppressed globally so the signal-bearing S-rules (S104,
# S105, S310, S311, S608) stay actionable rather than drowned in style noise.
ignore = [
    "S101",  # assert — used for internal invariants, stripped only under -O (not shipped that way)
    "S110",  # try-except-pass — deliberate best-effort cleanup
    "S112",  # try-except-continue — deliberate best-effort skip
    "S603",  # subprocess-without-shell — all calls are argv lists, never shell=True (audited)
    "S607",  # partial-executable-path — git/osascript/sudo/crontab resolved via PATH by design
]

[tool.ruff.lint.isort]
# tomllib is stdlib from 3.11; below target-version ruff files it as third-party.
extra-standard-library = ["tomllib"]

[tool.ruff.lint.per-file-ignores]
# Both board pages and the reporting slide deck used to be listed here as
# embedded front-end assets — files exempt from the line-length rule because
# they carried multi-KB CSS and JS strings. All three are React shells now, and
# holding them to the normal rules is what stops a hand-written page growing
# back. (html_theme.py and the ten exporters still build markup in Python, but
# they were never exempt: that code wraps.)
# Tests deliberately use asserts, toy secrets, temp paths, and localhost URLs —
# they are never shipped, so the bandit (S) category is not meaningful here.
"tests/**" = ["S"]

[dependency-groups]
dev = [
    "syrupy>=5.1.0",
]

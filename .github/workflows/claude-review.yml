# Async Claude code + security review — runs ONLY after the full CI workflow
# has passed on a PR.
#
# Trigger is `workflow_run` on CI completion (not `pull_request`): the review
# never runs on a red PR (no tokens burned reviewing code that already fails
# tests) and never parks a failing/pending check on the PR while CI is still
# going. Still deliberately NON-BLOCKING: not a required check — ci.yml
# remains the merge gate; this can only add review comments.
#
# Because workflow_run loses the PR context, the PR is resolved from the CI
# run's head SHA, and the old trigger filters are reimplemented there: skip
# drafts and Dependabot PRs (dependabot-auto.yml owns those).
#
# We deliberately do NOT skip the auto-version bot's `chore: bump version`
# commit. auto-version pushes that commit to the PR branch, which fires a fresh
# CI run; ci.yml's own `cancel-in-progress` concurrency then cancels the
# in-flight CI run on the pre-bump commit. A cancelled run isn't `success`, so
# its workflow_run never fires — meaning the bump commit is usually the ONLY CI
# run that reaches `success` on a feature PR. Skipping it dropped the review
# entirely. Reviewing it is correct anyway: `gh pr diff` shows the whole PR
# (feature changes + the one version line), and the per-branch
# `cancel-in-progress` below guarantees exactly one review, on the final head.
#
# The above is necessary but was NOT sufficient. Because auto-version originally
# pushed the bump with the default GITHUB_TOKEN, the bump commit's CI run was
# bot-actored, and GitHub's recursive-run guard emitted no `workflow_run` event
# for it at all. So the one CI run that reaches `success` on a bumped PR was
# precisely the one this workflow could never see — no run, no skip, no signal,
# and 7 of 12 merged PRs went unreviewed. auto-version.yml now pushes with
# `secrets.AUTO_VERSION_PAT` so the event fires; if that secret is ever removed,
# reviews silently stop again.

name: Claude Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: claude-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Resolve PR for this CI run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Open OR already-merged: fast merges land seconds after CI goes green,
          # which used to race this resolve step ("no open PR") and silently drop
          # the review. A post-merge advisory comment is still the product here.
          # Closed-without-merge PRs stay excluded — nothing to advise on.
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '[.[] | select(.state == "open" or .merged_at != null)][0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open or merged PR for this run — skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(jq -r '.number' <<< "$pr")
          draft=$(jq -r '.draft' <<< "$pr")
          author=$(jq -r '.user.login' <<< "$pr")
          # `.labels[]?` rather than `.labels[]`: a payload without the key makes
          # jq exit non-zero, and `run:` steps are `bash -e`, so the review job
          # would die rather than fall through to the skip below.
          cowork=$(jq -r '[.labels[]?.name] | index("cowork") != null' <<< "$pr")
          branch=$(jq -r '.head.ref' <<< "$pr")
          # The branch namespaces an unattended run pushes to, kept in step with
          # UNATTENDED_BRANCH_PREFIXES in scripts/pr_feedback.py. That gate now
          # refuses to wave through a machine PR, so if this filter skipped one
          # the PR would sit red forever waiting for a review nobody was going to
          # write. Widen both or neither.
          case "$branch" in
            cowork/*|feature/issue-*|security/codeql-triage*|ci-sentinel/*) unattended=true ;;
            *) unattended=false ;;
          esac
          echo "PR #$number by $author on $branch (draft=$draft, cowork=$cowork, unattended=$unattended)"
          # `cowork`-labelled PRs are never skipped for authorship. The claude.yml
          # `implement` job opens them unattended from an issue a human approved,
          # and if the action pushes as github-actions[bot] the bot filter below
          # would silently drop the review on exactly the PRs that most need one.
          # This is the same failure shape as the AUTO_VERSION_PAT incident above:
          # no run, no skip notice, no signal. Drafts are still skipped.
          # How many findings-bearing verdicts this reviewer may post, and it is
          # per lane. Both numbers are mirrored from scripts/pr_feedback.py
          # (MAX_REVIEW_ROUNDS / LOCAL_REVIEW_ROUNDS) and pinned by
          # tests/unit/test_pr_feedback.py::TestTheReviewCaps — a bash literal in
          # a YAML file is invisible to every other check in this repo.
          #
          # ONE on a local branch. The author is sitting right there and will read
          # what comes back; a second adversarial pass over the same diff costs a
          # full model run on every push and finds the tail, not the bug. The gate
          # does not enforce on that lane at all, so a second round could only ever
          # produce advice nobody asked for twice.
          #
          # TWO on the unattended lane, where the second round is the one that
          # catches the blocker the first round's fix introduced — and where
          # pr_feedback.py stops blocking on anything but a `critical` finding
          # after the first. Reviewing past the point the gate stops reading is
          # worse than not reviewing: the findings get written and ignored.
          if [ "$unattended" = "true" ] || [ "$cowork" = "true" ]; then
            cap=2
          else
            cap=1
          fi
          # The trailing `-->` is deliberately not matched: the marker gained an
          # optional ` critical=M` field before it, and anchoring on the close
          # would silently stop counting every verdict that carries one — the
          # round counter would read zero forever and the loop would never end.
          rounds=$(gh api "repos/${{ github.repository }}/issues/$number/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]") | .body
                   | capture("<!-- pr-feedback: claude-review open=(?<n>[0-9]+)")
                   | select(.n != "0")] | length' 2>/dev/null || echo 0)
          echo "findings-bearing review rounds so far: $rounds (cap $cap, unattended=$unattended)"
          if [ "${rounds:-0}" -ge "$cap" ]; then
            echo "Review cap reached for this lane — not reviewing again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "Draft PR — skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$cowork" != "true" ] && [ "$unattended" != "true" ] && { [ "$author" = "dependabot[bot]" ] || [ "$author" = "github-actions[bot]" ]; }; then
            echo "Bot-authored PR, no cowork label and not an unattended branch — skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.pr.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude review
        if: steps.pr.outputs.skip == 'false'
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1.0.196
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the action prints a bare `is_error: true` and no reason,
          # so a credential outage looks identical to a bad prompt. That is how
          # the 401 that took every Claude workflow down on 2026-07-30 went a day
          # and a half misdiagnosed as a model-alias problem — see the long note
          # in auto-version.yml. The prompt and diff are public repo content, so
          # there is nothing here to hide.
          show_full_output: true
          prompt: |
            Read AGENTS.md and .agents/repo-notes.md before starting.
            Read the relevant .agents/skills/*/SKILL.md for any area you touch.

            Review PR #${{ steps.pr.outputs.number }} in ${{ github.repository }}.
            The full CI suite has already passed on this PR — do not re-verify what
            CI covers; focus on what tests cannot catch.

            Read the diff with `gh pr diff ${{ steps.pr.outputs.number }}` and the PR
            description with `gh pr view ${{ steps.pr.outputs.number }}`. Repo conventions
            are split across AGENTS.md and `.agents/skills/*/SKILL.md` — Read the SKILL.md
            for each area the diff touches (see the skills index table in AGENTS.md)
            before judging convention violations. Then review for:

            1. **Correctness** — real bugs only: logic errors, broken edge cases, state
               serialization issues (frozen dataclass fields without defaults break --resume),
               concurrency problems in the retro/standup servers.
            2. **Repo conventions (AGENTS.md)** — three-pillar observability (logging via
               logging_setup, paths from paths.py, tests for every new function), TUI component
               standards (shared components from ui/shared/_components.py, theme colours not
               hardcoded RGB), parse → fallback → format pattern in generation code, prompts
               separated in prompts/.
            3. **Security** — injected/unescaped untrusted input (LAN retro cards, tracker
               ticket text), secrets or tokens logged or committed, unsafe subprocess/network
               use, missing auth on new server endpoints.

            Before judging anything, read the existing comments on this PR with
            `gh pr view ${{ steps.pr.outputs.number }} --json comments`. **A finding
            already answered in a reply there is not a finding** — do not re-report it.
            Someone took the time to say why they are not changing it, and a reviewer
            that keeps re-raising an answered point trains everyone to stop reading it.

            **A claimed fix is not an answer — it is a claim you are the check on.**
            A reply ending `<!-- addressed: claude-review fixed=N -->` says somebody
            changed the code, and nothing but this review verifies that. Read the
            change and re-report the finding if it is still there. `answered=` is the
            half that says "not changing this, and here is why"; `fixed=` is the half
            you check. Treating the two the same would turn the marker into a way to
            switch you off.

            Post the result as a single PR review comment via
            `gh pr comment ${{ steps.pr.outputs.number }} --body "..."`:
            a short verdict line, then only findings that matter (file:line, what, why).
            If there are no significant findings, post one line saying the review passed.
            Do not comment on style that ruff already enforces. Do not request changes on
            nitpicks. This review is advisory — never attempt to approve, merge, or block.

            **End the comment with this exact line, on its own:**

                <!-- pr-feedback: claude-review open=N critical=M -->

            **N** is the number of findings you just reported that a reasonable author
            must act on or answer — the `blocker` and `should-fix` ones, the same bar
            `/ship` resolves against. Nits, praise, and observations count zero. A clean
            review is `open=0 critical=0`.

            **M** is the `blocker` subset of those N: the ones where merging as-is ships
            a defect. Data loss, a security hole, a crash on a normal path, a broken
            migration. M is 0 on most reviews and that is the expected answer — a
            should-fix finding is not a blocker just because it is real.

            That line is not decoration, and the two numbers do different jobs.
            `scripts/pr_feedback.py` counts them, and the `pr-feedback` commit status
            blocks the merge on N for the **first** round only; after that **only M**
            holds it. So an inflated M is the expensive mistake here — it is the one
            number that can hold a merge indefinitely. An inflated N costs one round.
            Omitting the line does not make the PR mergeable: it makes the gate report
            that the review never ran. If you are unsure whether something is a nit, it
            is a nit; if you are unsure whether something is a blocker, it is not.

            Budget your turns: posting the comment is the one non-negotiable step.
            On a large diff, skim breadth-first and go deep only on the riskiest
            files rather than reading everything — an 80% review that posts beats
            a 100% review that runs out of turns. If you notice you are close to
            the turn limit, stop investigating and post what you have.
          # Review stays on the `deep` tier — judgment quality is
          # the point, and volume is already gated to green PRs by workflow_run.
          # That is what the action's implicit default already gave it; the `||`
          # fallback pins the prior behaviour explicitly.
          # --max-turns was 25; large PRs (skills to read + a big diff) burned all
          # 25 on investigation and died before posting ("Reached maximum number
          # of turns"), dropping the review entirely on exactly the PRs that most
          # needed one.
          claude_args: >-
            --model ${{ vars.YEABOI_MODEL_DEEP || 'claude-opus-5' }} --max-turns 60 --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment ${{ steps.pr.outputs.number }}:*),Bash(gh run view:*),Read,Grep,Glob"

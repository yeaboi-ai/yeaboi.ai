name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token — these jobs only check out code and run tests.
permissions:
  contents: read

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── What does this change actually need? ─────────────────────────────────
  # Every job below used to run on every push. A one-line docs edit rebuilt the
  # front-end bundles, cross-compiled Go, and ran 11,000 unit tests twice.
  #
  # This job maps the changed paths onto areas (one per cowork workstream) and
  # hands the rest of the workflow a pytest selection plus a set of job flags.
  # `scripts/test_scope.py` owns every comparison — see its module docstring for
  # the three rules, and tests/unit/test_test_scope.py for the totality checks
  # that stop it losing a test file.
  #
  # Cheap on purpose: no `uv sync`, no `setup-uv`, stdlib-only Python. It sits in
  # front of the whole pipeline, so anything slow here is paid by every run.
  scope:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      unit_paths: ${{ steps.scope.outputs.unit_paths }}
      slow_paths: ${{ steps.scope.outputs.slow_paths }}
      package: ${{ steps.scope.outputs.package }}
      eval: ${{ steps.scope.outputs.eval }}
      compat: ${{ steps.scope.outputs.compat }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff below is against the merge-base, which a
          # shallow clone cannot compute.
          fetch-depth: 0
      - name: Resolve the scope
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # FAIL-SAFE: this step must never exit non-zero, and deliberately does
          # not `set -e`. `unit` and `integration` are required contexts and they
          # `needs: scope` — and a dependency that FAILS skips them exactly as a
          # dependency that was skipped does. A required check that never posts
          # blocks the PR forever with nothing in the UI naming the cause, which
          # is the outage the comment block below this job describes. So every
          # failure path here falls back to the full suite; the worst this job
          # can do is cost minutes, never block a merge.
          # `test_workflow_schema.py` asserts the fallback writes every key the
          # script itself writes, so the two cannot drift.
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to `main` is the tree everything else is cut from, and it is
            # rare. Nothing is saved by being clever here.
            echo "push to ${{ github.ref }} — running everything"
            printf 'no-scope-on-push\n' > changed.txt
          else
            git fetch --no-tags origin "$BASE_REF" || true
            # The MERGE-BASE, not the base tip: against the tip, a branch that
            # simply has not been rebased reads every commit `main` gained since
            # as part of this PR. And from the local checkout, never
            # `gh pr diff` — the API refuses any diff over 20000 lines with a
            # 406, which is how PR #111 shipped with no version bump at all.
            MERGE_BASE=$(git merge-base FETCH_HEAD HEAD || true)
            echo "merge-base: ${MERGE_BASE:-<unresolved>}"
            # `|| true` throughout: an empty file reaches test_scope.py as "no
            # changed files were reported", which it treats as a full run. A
            # failed diff must never look like a change that touched nothing.
            # `--no-renames` so a move reports both the path it left and the one
            # it arrived at — the source area's tests are the ones a move breaks.
            if [ -n "$MERGE_BASE" ]; then
              git diff --name-only --no-renames "$MERGE_BASE...HEAD" > changed.txt || true
            fi
            touch changed.txt
          fi
          wc -l < changed.txt
          if ! python3 scripts/test_scope.py --changed-files changed.txt --github-output; then
            echo "::warning::test_scope.py failed to resolve the scope — running everything"
            {
              echo "full=true"
              echo "unit_paths=tests/unit/ tests/*.py"
              echo "slow_paths=tests/integration/ tests/contract/"
              echo "package=true"
              echo "eval=true"
              echo "compat=true"
            } >> "$GITHUB_OUTPUT"
          fi

  # ── Fast gate ────────────────────────────────────────────────────────────
  # Unit tests — also enforced locally by the pre-commit hook in
  # .pre-commit-config.yaml. Running them in CI too catches contributors
  # who haven't installed pre-commit.
  # NO `if:` ON THIS JOB, AND THE SAME GOES FOR `integration`, `lint`,
  # `format-check` and `security`. Their names are required contexts on the
  # `main-branch` ruleset, and a required context attached to a job that can be
  # skipped is the failure this repo has already had once: a required check
  # nothing posts blocks every PR forever, with all other checks green and
  # nothing in the UI saying why (see the header of pr-feedback.yml). Scoping
  # changes what these jobs *run*, never whether they report.
  unit:
    name: Unit tests
    needs: scope
    runs-on: ubuntu-latest
    # The lane takes ~2 minutes. This is not a performance budget, it is a
    # deadlock backstop: a test that waits on something that never arrives holds
    # a runner for GitHub's 6-hour default, and four of these hung at once once.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The floor, not a middle version: 3.10 is where a version difference can
      # actually break, and running the required job there costs nothing extra.
      # The `--python` pin is mandatory — runners ship 3.12/3.13 preinstalled and
      # `uv sync` will happily pick one, leaving a "3.10 job" that proves nothing.
      - run: uv python install 3.10
      - run: uv sync --extra dev --python 3.10
      - run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
      # UNIT_PATHS is the scope job's selection. A command-line make variable
      # beats the Makefile's `?=`, so an empty output would NOT fall back to the
      # default — `UNIT_LANE` in the Makefile resolves the empty case instead.
      - env:
          UNIT_PATHS: ${{ needs.scope.outputs.unit_paths }}
        run: make test-fast UNIT_PATHS="$UNIT_PATHS"

  # ── Version compatibility ────────────────────────────────────────────────
  # The unit lane on every supported version ABOVE the floor. `unit` already
  # covers 3.10, so this is the ceiling and the middle.
  #
  # This job carries an `if:` and MUST NOT become a required context. That is
  # the whole reason the matrix lives here instead of on `unit`: `strategy.matrix`
  # renames a check to "Unit tests (3.12)", and a required context nothing posts
  # blocks every PR forever — the outage described above this file's `unit` job.
  compat:
    name: Python ${{ matrix.python }}
    needs: scope
    if: needs.scope.outputs.compat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # deadlock backstop — see `unit`
    strategy:
      # One version failing must not hide the others: which versions break is
      # the entire signal this job exists to produce.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - env:
          EXPECTED: ${{ matrix.python }}
        run: uv run python -c "import os,sys; assert '.'.join(map(str,sys.version_info[:2])) == os.environ['EXPECTED'], sys.version"
      # The whole unit lane, not the scoped selection: this job is gated on the
      # version surfaces, so when it runs at all it should run everything.
      - run: make test-fast

  # ── Slow suite ───────────────────────────────────────────────────────────
  # Integration + contract tests (marked @pytest.mark.slow) — too slow for
  # pre-commit but must pass before any PR merges. All external calls are
  # mocked or VCR-replayed; no real API keys required.
  integration:
    name: Integration & contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.10
      - run: uv sync --extra dev --python 3.10
      - run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
      # `make test-slow`, not `make test`. This job ran `make test`, which is
      # tests/unit + tests/integration + tests/contract — so it re-ran, in full,
      # the same 11,000 unit tests the job above had just run. 310 of its 408
      # seconds were a duplicate. The genuinely additional work is 572 tests.
      #
      # `make test` keeps its meaning as the full local gate that /ship, the DoD
      # and both publish workflows run; only CI splits the two halves, because
      # only CI has a second job already covering one of them.
      - run: make test-slow

  # ── Golden evaluators ────────────────────────────────────────────────────
  # LLM-output quality checks against the golden dataset.
  # Kept separate so a quality regression doesn't block unrelated PRs.
  eval:
    name: Golden evaluators
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.eval == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make eval

  # ── Code quality ─────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make lint
      # The shared-tooling contract: the `.tooling` pin is honoured, the copied
      # bootstrap has not drifted, and this repo still defines every target the
      # devkit plugin's commands and hooks call on it. A renamed target is
      # otherwise silent — the Stop hook skips what a repo does not define, so
      # verification would just quietly stop happening.
      - run: make tooling-check

  # Nothing in CI read the workflow files themselves until this job existed, and
  # the cost of that was four days of a dead merge gate: `pr-feedback.yml`
  # carried a trigger GitHub rejects, so the whole file was unparseable, every
  # run was a zero-job failure attributed to `push`, and the required status it
  # was supposed to post never appeared on a single commit. Every other check was
  # green throughout. A workflow that cannot parse is invisible to every tool
  # that reads workflows — including the ones that would have told us.
  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pinned release tarball rather than a third-party action: this repo
      # requires every third-party `uses:` to be SHA-pinned
      # (tests/unit/test_codeql_triage.py), and adding a linter is a poor reason
      # to add a supply-chain dependency whose SHA nobody here can verify. The
      # version moves deliberately, in a diff.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  format-check:
    name: Format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: make format-check

  # Assert the built wheel still declares yeaboi-web-assets. The source tree
  # satisfies that dependency from the venv, so a packaging change that dropped
  # it from the metadata would leave every test green and every board blank for
  # anyone installing from PyPI. Cheap insurance.
  package:
    name: Wheel declares its dependencies
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.11
      # The assertion lives in scripts/check_wheel_deps.py so `make package-check`
      # runs the identical check locally — inline here, the only way to fail it was
      # to open the PR.
      - run: make package-check

  # ── Feature clips ────────────────────────────────────────────────────────
  # Optional by construction: the nudge always exits 0, and neither job may be
  # a required check. Pinned to the same sha as .tooling-rev so one bump moves
  # the recorder and the workflow that drives it together.
  clips:
    name: Feature clips
    uses: yeaboi-ai/yeaboi-tooling/.github/workflows/clip-check.yml@377cf65dadeafd6b69e713f1f0f6a6bf1721ef31
    permissions:
      contents: read
      pull-requests: write
    with:
      surface-paths: |
        src/yeaboi/ui/*
        src/yeaboi/web/*
        src/yeaboi/cli.py
        src/yeaboi/*_exporter.py
        claude-plugin/*

  # ── Security ─────────────────────────────────────────────────────────────
  # SAST (ruff flake8-bandit "S" rules) + dependency CVE audit (pip-audit
  # against the committed uv.lock) + secret scanning (gitleaks). Mirrors the
  # `make security` target contributors can run locally.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan all commits on a PR, not just the tip.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: SAST + dependency audit
        run: make security
      # The CLI, not gitleaks-action: since v3 that action refuses to run for a
      # GitHub organisation without a paid licence key, and this repo is one.
      # Same scanner and same version the pre-commit hook runs locally, pinned
      # by digest — a secret scanner fetched over the network is exactly the
      # thing not to take on trust.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

name: Auto Version Bump

# Classify each PR and, for release-worthy changes, bump the version in
# pyproject.toml on the PR branch. Cheap deterministic guards run first; the LLM
# is only asked to choose the semver level when the change actually ships code.
#
# Merging then triggers publish-beta.yml, which publishes a PyPI PRE-RELEASE
# (X.Y.ZrcN) and nothing else. Those accumulate until a human promotes the batch,
# and publish.yml cuts the official X.Y.Z. So this workflow decides what the next
# final version WILL be; it no longer decides that anything ships to users.
#
# It must keep writing a plain X.Y.Z. scripts/bump_version.py rejects anything
# else, and an rc string committed here would break the next PR's bump and the one
# after — the rc suffix is stamped into a throwaway checkout in the publish job,
# never into the repo.
#
# The bump lands on the PR *branch* (not main) on purpose: the human merge is what
# pushes to main and triggers publish-beta.yml — so nothing here has to push to
# main.
#
# The bump push DOES need a real identity, though (see the checkout step): pushing
# it as the default GITHUB_TOKEN makes the resulting CI run bot-actored, and GitHub
# then suppresses that run's `workflow_run` event — which silently killed
# claude-review.yml and dependabot-auto.yml on every bumped PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

concurrency:
  group: auto-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: Decide & apply version bump
    # Same-repo PRs only (forks can't push to the head branch or read secrets).
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the bump to the PR branch
      pull-requests: write # post the explanation comment
      id-token: write # claude-code-action OIDC
    steps:
      # The `|| github.token` fallback below keeps the bump working when the
      # secret is absent, but that silently restores the review-dropping
      # behaviour this workflow exists to prevent. Make the degraded mode
      # visible instead of invisible. (`secrets` is not available in a step
      # `if:`, so this tests a materialized env var rather than branching.)
      - name: Warn if the review-restoring PAT is missing
        env:
          HAS_PAT: ${{ secrets.AUTO_VERSION_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AUTO_VERSION_PAT is not set — the bump will be pushed as GITHUB_TOKEN, so the bump commit's CI run will emit no workflow_run and Claude Review will NOT run on this PR."
          fi

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # These persisted credentials are what Claude's `git push` of the
          # `chore: bump version` commit uses. With the default GITHUB_TOKEN that
          # push produces a bot-actored CI run, and GitHub's recursive-run guard
          # then emits NO `workflow_run` event when it completes — so Claude
          # Review and Dependabot verify never fired on a bumped PR (and never
          # showed up as skipped either: there was simply no run). A PAT makes the
          # push a real identity, so the event fires normally.
          #
          # AUTO_VERSION_PAT MUST be a *fine-grained* PAT scoped to this single
          # repository with `Contents: read and write` and nothing else. Do not
          # substitute a classic `repo`-scoped token on rotation: the steps below
          # run `claude-code-action` with unrestricted `Bash` against code checked
          # out FROM THE PR BRANCH (including `scripts/bump_version.py` and
          # `scripts/changelog_stub.py`, which the fallback step runs too), and
          # checkout persists this credential into `.git/config`. A fine-grained
          # token bounds a leak to this repo's contents; a classic one would
          # expose the whole account, and the job's `permissions:` block does not
          # constrain a PAT the way it constrains github.token.
          #
          # Falls back to github.token so the workflow still works before the
          # secret exists — that just restores the old (review-dropping) behaviour
          # rather than failing the bump outright. The step above warns when that
          # fallback is in effect.
          #
          # This re-triggers auto-version itself, exactly as the GITHUB_TOKEN push
          # already did; the "already bumped in this PR" branch of the guards step
          # below short-circuits the second run (that guard is pure git/grep over
          # pyproject.toml + changelog_data.json, so it is token-independent).
          token: ${{ secrets.AUTO_VERSION_PAT || github.token }}

      - name: Deterministic guards
        id: guard
        env:
          # No GH_TOKEN / PR number: this step is pure git + grep over the
          # checkout now, and calls no API at all.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          ver() { sed -nE 's/^version = "([^"]+)".*/\1/p' | head -1; }
          git fetch --no-tags origin "$BASE_REF"
          # Compare against the MERGE-BASE, not the base tip. This guard asks
          # "did *this PR* change the version?", and only the merge-base answers
          # that. Against the tip, any branch that simply hasn't been rebased
          # since main's last release reads as HEAD_V != BASE_V and falls into
          # the "already bumped" skip below — shipping with no bump and no
          # changelog entry, silently. Because auto-version bumps main on every
          # release-worthy merge, that is the common case, not an edge case:
          # PR #120 hit it within hours (base 2.44.0 vs an un-rebased 2.43.0).
          # Same silent-skip class as the diff-range bug fixed in #114, which
          # moved the *file list* to a merge-base diff but left this on the tip.
          MERGE_BASE=$(git merge-base FETCH_HEAD HEAD)
          BASE_V=$(git show "$MERGE_BASE:pyproject.toml" | ver)
          HEAD_V=$(ver < pyproject.toml)
          echo "base=$BASE_V head=$HEAD_V merge_base=$MERGE_BASE labels=[$LABELS]"

          # 1) Already bumped in this PR (manual, or a prior auto run)?
          #    If the changelog already has an entry for the new version too ->
          #    skip (keeps re-runs on `synchronize` idempotent). If the entry is
          #    missing (e.g. a manual bump), run Claude in changelog-only mode so
          #    every release still ships its notes. Known limitation: commits
          #    pushed after the bump+entry land won't refresh the entry — same
          #    acceptance class as the dual-PR version race documented below.
          if [ "$HEAD_V" != "$BASE_V" ]; then
            if python scripts/changelog_stub.py is-stub "$HEAD_V"; then
              # The fallback below wrote a placeholder while Claude was down: run
              # changelog-only so a working Claude rewrites it in place.
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "changelog_only=true" >> "$GITHUB_OUTPUT"
              echo "::notice::version already bumped ($BASE_V -> $HEAD_V) with a placeholder changelog entry; running changelog-only to write the real one."
            elif grep -q "\"version\": \"$HEAD_V\"" src/yeaboi/changelog_data.json; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::version already changed in this PR ($BASE_V -> $HEAD_V) and changelog entry exists; skipping."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "changelog_only=true" >> "$GITHUB_OUTPUT"
              echo "::notice::version already bumped ($BASE_V -> $HEAD_V) but changelog entry missing; running changelog-only."
            fi
            exit 0
          fi

          # 2) A semver:* / release:skip label forces the LLM step to run.
          case ",$LABELS," in
            *,semver:major,*|*,semver:minor,*|*,semver:patch,*|*,semver:none,*|*,release:skip,*)
              echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # 3) Trivial PR? No shipping code changed -> skip (docs/chore/tests/CI only).
          #    The changelog data file is excluded: an entry-only edit (e.g. a
          #    wording fix) must not trigger a new release by itself.
          #
          #    The file list comes from the local checkout, NOT `gh pr diff`. The
          #    API refuses any diff over 20000 lines with `HTTP 406 ... diff
          #    exceeded the maximum number of lines`, and because the call sat in
          #    an `if` condition, `set -e` did not apply: the failure was
          #    indistinguishable from "no files matched" and fell straight into
          #    the skip branch. PR #111 (the React migration) rewrote most of
          #    src/yeaboi/ and shipped with no bump and no release because of it —
          #    the only trace was a `::notice::no src/yeaboi changes` on a PR that
          #    changed hundreds of them. `fetch-depth: 0` plus the base fetch above
          #    make the merge-base diff exact and unbounded, and assigning it to a
          #    variable first means a git failure aborts the job under `set -e`
          #    instead of silently reading as "nothing to release".
          CHANGED=$(git diff --name-only FETCH_HEAD...HEAD)
          echo "changed files: $(printf '%s' "$CHANGED" | grep -c . || true)"
          if printf '%s\n' "$CHANGED" | grep -E '^src/yeaboi/' | grep -vE '^src/yeaboi/changelog_data\.json$' | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no src/yeaboi changes; skipping version bump."
          fi

      # Every claude-code-action run in this repo has died on `401 OAuth access
      # token is invalid` since 2026-07-30 — auto-version, claude-review, all of
      # them. The first diagnosis blamed the Haiku alias (PR #120) only because
      # the action hid the message; the credential was the fault the whole time,
      # and Haiku was simply the first workflow to be noticed. Rotating the
      # secret on 2026-07-31 did not clear it either, which is the signature of a
      # value that is not a Claude Code OAuth token at all rather than one that
      # has merely expired.
      #
      # This step catches that class before a turn is spent, and — unlike the
      # action itself, which skips on any workflow-file edit — it still runs on
      # the PR that changes this file, so a fix here is testable before it lands.
      #
      # It NEVER prints the secret or any substring of it. GitHub masks the exact
      # value but not a prefix of it, so every test below reduces to a boolean
      # first.
      #
      # Deliberately narrow: it fails only on shapes that CANNOT be a working
      # credential (absent, whitespace- or quote-wrapped, or a Console API key
      # sitting in the OAuth secret). A well-formed but expired/revoked token
      # still goes through to the action, which now reports its own 401 thanks to
      # show_full_output. Anything stricter — an allowlist of known-good prefixes
      # — would turn the next change to Anthropic's token format into a false red
      # on every PR, which is the failure mode this file keeps relearning.
      - name: Preflight the Claude credential
        if: steps.guard.outputs.skip == 'false'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            fail "No Claude credential in this repository's Actions secrets. Set one: 'claude setup-token' then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN', or 'gh secret set ANTHROPIC_API_KEY' with a Console key."
          fi

          # Both credentials get the mangled-paste checks. A newline-bearing
          # Console key fails exactly as opaquely as a newline-bearing OAuth
          # token, so checking only one of them leaves half the door open.
          #
          # NOTE for future edits: never add `set -x` to this step, and never
          # echo $STRIPPED. GitHub masks the *exact* secret string it was given;
          # a whitespace-stripped near-copy of it is NOT masked and would print
          # in the clear.
          for VAR in OAUTH APIKEY; do
            VAL="${!VAR}"
            [ -n "$VAL" ] || continue
            NAME="CLAUDE_CODE_OAUTH_TOKEN"
            [ "$VAR" = "APIKEY" ] && NAME="ANTHROPIC_API_KEY"

            # A stray newline or space survives a paste into the secrets UI and
            # produces exactly the same opaque 401 as a wrong token.
            STRIPPED=$(printf '%s' "$VAL" | tr -d '[:space:]')
            if [ "${#STRIPPED}" -ne "${#VAL}" ]; then
              fail "$NAME contains whitespace — a newline or space came along with the paste. Re-set it, taking care to send no trailing newline."
            fi
            case "$VAL" in
              '"'*|"'"*)
                fail "$NAME is wrapped in quotes. Store the raw value with no surrounding quotes." ;;
            esac
          done

          # Only meaningful for the OAuth slot, and only when that slot is the
          # one being used: if ANTHROPIC_API_KEY is also set we do not hard-fail,
          # because which input the action prefers is an assumption we have not
          # observed here (see the note on the action inputs below) and a wrong
          # assumption that reds every PR is worse than a missed diagnosis.
          case "$OAUTH" in
            sk-ant-api*)
              MSG="CLAUDE_CODE_OAUTH_TOKEN holds an Anthropic Console API key (sk-ant-api...), not a Claude Code OAuth token (sk-ant-oat...). The API rejects that with a 401. Either run 'claude setup-token' and re-set CLAUDE_CODE_OAUTH_TOKEN, or move this value to the ANTHROPIC_API_KEY secret — this workflow reads both."
              if [ -n "$APIKEY" ]; then echo "::warning::$MSG"; else fail "$MSG"; fi ;;
          esac

          # Length is the fastest way to tell a truncated paste, or a whole
          # terminal banner captured instead of just the token, apart from a
          # clean value the API simply refuses. It is one integer about a
          # high-entropy string and every token of a given kind is roughly the
          # same size, so it identifies nothing — but it is the difference
          # between "GitHub holds a mangled copy" and "the account revoked it",
          # which is otherwise indistinguishable from the outside.
          echo "::notice::Claude credential present and well-formed (oauth=$([ -n "$OAUTH" ] && echo yes || echo no) len=${#OAUTH}, api_key=$([ -n "$APIKEY" ] && echo yes || echo no) len=${#APIKEY}). If the step after this one still fails with 401, the stored value is intact and the token was revoked or minted against the wrong account — re-mint it rather than re-pasting."

      # A failure here no longer fails the bump: the fallback step below lands a
      # deterministic bump when Claude cannot, and the explainer still names the
      # cause. `outcome` (not `conclusion`) is what carries the real result once
      # continue-on-error is set.
      - name: Classify & bump with Claude
        id: claude
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Second accepted credential, so a Console API key is a usable fallback
          # when the subscription OAuth token is the thing that broke. Empty
          # unless the secret exists; the action passes each through as its own
          # env var.
          #
          # UNVERIFIED: the SDK is *believed* to prefer CLAUDE_CODE_OAUTH_TOKEN
          # when both are set, which would mean a stale OAuth token is not
          # rescued by adding a key beside it and you must clear it to fall
          # through. Not observed here — every run in this repo's history has
          # anthropic_api_key empty, so nothing has ever exercised the
          # precedence. Treat it as an assumption until a probe says otherwise;
          # the incident this file documents was caused by exactly this kind of
          # confidently-stated guess.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Show the SDK's own output. Without this the action prints only
          # `Running Claude Code via SDK (full output hidden for security)` and a
          # bare `is_error: true` with no message — which is why the two model
          # outages below each took a round of blind guessing to diagnose. The
          # prompt and diff here are public repo content, so there is nothing to
          # hide; keep this on so the next failure reports itself.
          #
          # THIS FLAG CANNOT BE TESTED ON THE PR THAT ADDS IT. The action
          # validates that the workflow file is byte-identical to the copy on the
          # default branch, and *skips itself* when it isn't:
          #   "Skipping action due to workflow validation: … must have identical
          #    content to the version on the repository's default branch"
          # The skip reports the step as SUCCESS, so a PR editing this file gets a
          # green auto-version that never ran Claude at all. Two consequences:
          #   1. any change here is only exercised after it lands on main;
          #   2. a green check on a workflow-editing PR proves nothing — read the
          #      log for the validation warning before believing it.
          show_full_output: true
          # Semver classification is mechanical (labels always win; the bump is a
          # script; the changelog paragraph is short) — routed to Haiku for cost.
          # If wrong-level bumps appear, promote to claude-sonnet-5 (one line).
          #
          # Pin the DATED model id rather than the bare `claude-haiku-4-5` alias.
          # Keep the pin, but do NOT trust the story that used to be written here:
          # it claimed the alias stopped resolving between 2026-07-29 and
          # 2026-07-30 because runs died on turn 1 in ~2s with total_cost_usd 0
          # while sonnet-5 siblings passed. That was wrong on both halves — the
          # error was `401 OAuth access token is invalid`, and the sonnet-5
          # siblings were not passing, they were taking their skip branches. The
          # symptom read as model-shaped only because the action hid the SDK
          # output; show_full_output above is what finally printed the 401.
          #
          # The lesson, not the pin, is the load-bearing part: turn-1 + ~2s +
          # zero cost is the signature of an AUTH failure, not a model one. Check
          # `apiKeySource` and `api_error_status` in the run log before touching
          # this line.
          # Model comes from the `fast` tier repo variable. The `||` fallback is what this job ran on before the tier
          # table existed — an unset variable reverts, it does not break.
          claude_args: >-
            --model ${{ vars.YEABOI_MODEL_FAST || 'claude-haiku-4-5-20251001' }} --max-turns 15 --allowedTools "Bash,Read,Edit,Write"
          prompt: |
            Read AGENTS.md and .agents/repo-notes.md before starting.
            Read the relevant .agents/skills/*/SKILL.md for any area you touch.

            You are the release-versioning bot for this repository. Pull request #${{ github.event.pull_request.number }} is open; decide whether and how to bump the project version. The version lives only in pyproject.toml. Changelog-only mode: ${{ steps.guard.outputs.changelog_only || 'false' }}.

            Follow these steps exactly:

            1. If changelog-only mode is "true": the version was already bumped in this PR — do NOT bump again. Read the current version from pyproject.toml and skip straight to step 4 to write its changelog entry.

            2. Otherwise choose a semver level, in this priority order:
               a. Labels win. If the PR has label `semver:major`, `semver:minor`, or `semver:patch`, use that level. If it has `release:skip` or `semver:none`, treat the level as "none".
               b. Otherwise classify this PR's diff:
                  - "major": a backward-incompatible change (removed/renamed CLI flags, changed output formats, breaking behavior or public API).
                  - "minor": a new user-facing capability or feature.
                  - "patch": a bug fix, performance, or internal refactor with no new user-facing surface.
                  - "none": the diff only touches docs, comments, tests, or CI/workflow files.

            3. If the level is "none": do NOT modify any file. Post one short PR comment: "🏷️ auto-version: no release-worthy change — skipping bump." Then stop.
               Otherwise run exactly this command (it rewrites pyproject.toml and prints the NEW version):
                 python scripts/bump_version.py <level>

            4. Write the new version's changelog entry in src/yeaboi/changelog_data.json (this file ships inside the package and powers the in-app Changelog page and the desktop app's What's New). Prepend a new object at the TOP of the "entries" array (entries are newest-first):
               - "version": the new version (no leading "v")
               - "date": today's UTC date, YYYY-MM-DD
               - "headline": the entry's title — AT MOST 60 characters, sentence case, no trailing period, naming what a user can now do
               - "summary": AT MOST 240 characters and AT MOST 2 sentences, saying what changes for a user of the app
               - "highlights": 1-4 objects of {"text": "...", "areas": [...]} — each AT MOST 90 characters, no trailing period, tagged ONLY with areas from this fixed vocabulary: analysis, planning, standup, retro, performance, reporting, usage, settings, agents, general
               - Each highlight MAY also carry "surfaces": which of the product's surfaces the change applies to, from this fixed vocabulary: tui (terminal app + CLI), desktop (the desktop app), web (browser share/board pages). OMIT the key when the change applies everywhere — backend/engine work, the common case. Tag only surface-specific changes: a terminal screen layout change is ["tui"], a share-page change is ["web"], a desktop-only backend route is ["desktop"]. NEVER put a surface name in "areas".
               If an entry for that version already exists, update it in place instead. Keep the JSON valid (validate by running: python -c "import json; json.load(open('src/yeaboi/changelog_data.json'))").

               WRITE FOR A USER, NOT FOR A REVIEWER. Every string must name an outcome, never a component. No backticks, no --flags, no function() calls, no file names, no CamelCase or snake_case identifiers, no environment variables, no config keys, no refactor or test-coverage narration.

               NEVER DROP A CAVEAT. If this release requires something of the reader — a minimum terminal size, a package to install alongside, a setting to change, a step to take before upgrading — that is the most useful line in the entry and it must survive the limits. State it in plain English rather than naming the internal ("the welcome screen now needs a terminal at least 41 rows tall", not a row-count constant). Cut a nice-to-have highlight to make room, and never headline a release "Under-the-hood improvements" when it asks the reader to do something. Product and mode names are welcome: yeaboi, Niko, Jira, Slack, GitHub, Claude, Planning, Standup, Retro, Poker, Performance, Reporting, Ship, Usage, Settings.

               GOOD:
                 "headline": "Performance reviews show numbers, not paragraphs"
                 "summary": "Cycle time, story counts and test coverage now read as figures you can scan. The same review looks identical in the terminal, the browser and a share link."
                 "highlights": [{"text": "See cycle time and test coverage at a glance", "areas": ["performance"]}]
               BAD (rejected):
                 "summary": "The engine computes real figures once and projects them two ways — prompt prose for the LLM and structured records for the UI (PerfMetric, EvidenceGroup)…"
                 "highlights": [{"text": "New TUI components: stat tiles for KPIs, meters for ratios, repositioned coverage strip", "areas": ["tui"]}]

               If the release is genuinely internal, say so plainly rather than dressing it up: headline "Under-the-hood improvements", summary "Nothing changes in how yeaboi works — this release is internal plumbing and fixes."

               tests/unit/test_changelog.py enforces all of the above against the shipped file. Run it before committing: uv run pytest tests/unit/test_changelog.py -q. A failure names the entry and the rule it broke — fix the copy, do not touch the test.

            5. Commit the pyproject.toml and changelog_data.json changes together (changelog-only mode: just changelog_data.json) to this PR branch and push. Use commit message:
                 chore: bump version to <new-version> [auto]
               with trailer:
                 Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>

            6. Post one short PR comment naming the level, the new version, and a one-sentence reason.

            Rules: only ever edit pyproject.toml and src/yeaboi/changelog_data.json; never bump more than once; keep the comment to one or two lines.

      # The preflight above cannot catch a well-formed token that has expired or
      # been revoked — only the API can. When that happens the action fails with
      # a wall of SDK JSON whose one useful line is `"api_error_status": 401`,
      # and the check just reads "Action failed with error", which is what sent
      # the last investigation after the model instead of the token. Restate it
      # as an annotation with the remediation attached.
      #
      # The Claude step carries continue-on-error, so the job is not failing when
      # this runs and no status function is needed: `outcome` is the step's real
      # result, and `conclusion` would read success.
      #
      # The log path is the action's internal temp file, so it can move under the
      # floating @v1 tag. If it does, say so rather than going quietly no-op —
      # a diagnostic that silently stops diagnosing is the exact failure class
      # this whole branch exists to remove.
      - name: Explain an auth failure
        if: steps.guard.outputs.skip == 'false' && steps.claude.outcome == 'failure'
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$LOG" ]; then
            echo "::warning::No SDK log at $LOG — could not classify this failure. The action may have moved the file; check the step output above and update this path."
          elif grep -q '"api_error_status": *401' "$LOG"; then
            echo "::error::Claude rejected this repository's credential with HTTP 401. The secret exists and is well-formed, so it has expired or been revoked. Fix: run 'claude setup-token' on a machine logged into the Claude subscription, then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}'. This same secret backs claude-review, ci-sentinel, dependabot-auto, flaky-test-hunter, feedback-remediation and claude — they are all down until it is replaced."
          fi

      # When the Claude step fails the bump still lands. The level is mechanical
      # (labels win; otherwise a new module under src/yeaboi/ reads as a feature,
      # anything else as a fix) and the release notes are a placeholder the copy
      # contract accepts. The guard above recognises that placeholder on the next
      # push and runs Claude in changelog-only mode, so the real notes arrive on
      # their own once the credential is back — nothing to redo by hand. In
      # changelog-only mode there is nothing for this step to do: the version is
      # already bumped and the placeholder is already there. A preflight failure
      # (no credential, a mangled paste) still reds the job: that is a setting a
      # human has to fix, and hiding it behind a bump would keep it broken.
      - name: Fall back to a deterministic bump
        if: steps.guard.outputs.skip == 'false' && steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CHANGELOG_ONLY: ${{ steps.guard.outputs.changelog_only || 'false' }}
        run: |
          set -euo pipefail
          if [ "$CHANGELOG_ONLY" = "true" ]; then
            echo "::warning::Claude is unavailable, so the placeholder release notes stay for now; the next push will try again."
            exit 0
          fi
          # Claude may have failed AFTER editing or pushing (turns ran out, a push
          # was rejected). Bump only from the untouched PR head: if the branch has
          # moved since this run started, leave it to the run that push triggers.
          git fetch --no-tags origin "$HEAD_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::the branch moved during this run; leaving the bump to the run that follows."
            exit 0
          fi
          git reset -q --hard "$HEAD_SHA"
          case ",$LABELS," in
            *,release:skip,*|*,semver:none,*)
              gh pr comment "$PR" --body "🏷️ auto-version: no release-worthy change — skipping bump."
              exit 0 ;;
            *,semver:major,*) LEVEL="major" ;;
            *,semver:minor,*) LEVEL="minor" ;;
            *,semver:patch,*) LEVEL="patch" ;;
            *)
              # Into a variable first, as the guard does: `grep -q` closing the
              # pipe early reads as a failure under pipefail and would bump patch.
              git fetch --no-tags origin "$BASE_REF"
              ADDED=$(git diff --name-only --diff-filter=A FETCH_HEAD...HEAD)
              if printf '%s\n' "$ADDED" | grep -qE '^src/yeaboi/.*\.py$'; then
                LEVEL="minor"
              else
                LEVEL="patch"
              fi ;;
          esac
          NEW=$(python scripts/bump_version.py "$LEVEL")
          python scripts/changelog_stub.py write "$NEW" --pr "$PR"
          python -c "import json; json.load(open('src/yeaboi/changelog_data.json'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/yeaboi/changelog_data.json
          git commit -q -m "chore: bump version to $NEW [auto]" -m "Fallback bump: Claude was unavailable, so the level came from the labels or the diff and the release notes are a placeholder for the next run to rewrite."
          git push origin "HEAD:$HEAD_REF"
          gh pr comment "$PR" --body "🏷️ auto-version (fallback): Claude was unavailable, so this bumped **$LEVEL** to **$NEW** by rule — labels win, else a new module means minor, else patch — and wrote placeholder release notes. The next push rewrites them once the credential works; edit pyproject.toml by hand if the level is wrong."
          echo "::warning::Claude was unavailable; bumped $LEVEL to $NEW by rule with placeholder release notes."
